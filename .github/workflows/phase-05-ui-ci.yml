name: Phase 05 Web UI

on:
  push:
    branches:
      - phase/05-parties-customers
  pull_request:
    branches:
      - phase/05-parties-customers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase05-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      ARGIN_IDENTITY_UI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dotnet-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      RUN_ARGINTAXPAYER_PG_INTEGRATION: "0"
      ConnectionStrings__ArginTaxPayerDb: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ArginTaxPayer.sln
      - run: dotnet build ArginTaxPayer.sln -c Release --no-restore
      - run: dotnet test ArginTaxPayer.sln -c Release --no-build
