# Phase18 tax.argin.ir HTTPS server only: include INSIDE the existing tax-specific
# server { listen 443 ssl; server_name tax.argin.ir; ... } after independent review.
# Replace the existing maintenance location /; never duplicate a location /.
# Does not modify apex argin.ir, unrelated port 8080/8081 or certificate paths.
location / {
    proxy_pass http://127.0.0.1:15091;
    proxy_http_version 1.1;
    proxy_set_header Host tax.argin.ir;
    proxy_set_header X-Forwarded-Host tax.argin.ir;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Encrypted backup bundles use streaming through the authenticated Next.js proxy.
# Keep this limit in sync with BackupController__MaximumBundleBytes (default 2 GiB).
location ^~ /api/backup-control/ {
    client_max_body_size 2g;
    client_body_timeout 1800s;
    proxy_pass http://127.0.0.1:15091;
    proxy_http_version 1.1;
    proxy_set_header Host tax.argin.ir;
    proxy_set_header X-Forwarded-Host tax.argin.ir;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
