name: ArginTaxPayer versioned release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Promote this verified main-branch build to the VPS (requires production approval)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: argintaxpayer-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      RUN_ARGINTAXPAYER_PG_INTEGRATION: '0'
      Ghasedak__EnableLiveSending: 'false'
      SandboxInvoiceLegacy__Enabled: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify restricted deployment boundary
        run: |
          python3 -m unittest discover -s tests/ops -p 'test_phase18_deploy_helper.py' -v
          bash -n scripts/phase18-install-deploy-helper.sh
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Run API regression tests
        run: |
          dotnet restore ArginTaxPayer.sln
          dotnet test ArginTaxPayer.sln -c Release --no-restore
      - name: Build versioned API/Web
        run: |
          product_version="$(node -p "require('./apps/web/package.json').version")"
          release_version="${product_version} (Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})"
          echo "ARGIN_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          dotnet publish src/ArginTaxPayer.Api/ArginTaxPayer.Api.csproj -c Release --no-restore -o "$RUNNER_TEMP/api"
          npm --prefix apps/web ci --no-audit --no-fund
          npm --prefix apps/web test
          npm --prefix apps/web run typecheck
          NEXT_PUBLIC_APP_VERSION="$release_version" npm --prefix apps/web run build
      - name: Package immutable application, excluding secrets
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/stage/api bundle/stage/web bundle/scripts
          cp -a "$RUNNER_TEMP/api/." bundle/stage/api/
          cp apps/web/package.json apps/web/package-lock.json bundle/stage/web/
          cp -a apps/web/.next bundle/stage/web/
          if [[ -d apps/web/public ]]; then cp -a apps/web/public bundle/stage/web/; fi
          if find bundle/stage -type f \( -name '.env' -o -name '.env.*' -o -name '*.key' -o -name '*.pem' -o -name '*.pfx' \) | grep -q .; then
            echo 'Unexpected private configuration in build' >&2; exit 1
          fi
          (cd bundle/stage && tar -czf ../api.tar.gz api && tar -czf ../web.tar.gz web)
          (cd bundle && sha256sum api.tar.gz web.tar.gz > SHA256SUMS)
          printf 'sha=%s\n' "$GITHUB_SHA" > bundle/build-info.txt
          cp scripts/phase18-release-stage.sh scripts/phase18-release-promote.sh scripts/phase18-step06-local-health.sh bundle/scripts/
          rm -rf bundle/stage
      - uses: actions/upload-artifact@v4
        with:
          name: argintaxpayer-release
          path: bundle/
          if-no-files-found: error
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: package
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: argintaxpayer-release
          path: bundle
      - name: Configure verified deploy SSH
        env:
          DEPLOY_KEY: ${{ secrets.ARGIN_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ARGIN_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and promote reviewed release
        env:
          DEPLOY_HOST: ${{ secrets.ARGIN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARGIN_DEPLOY_USER }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          latest_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$SOURCE_SHA" == "$latest_sha" ]] || {
            echo 'Refusing an obsolete main release; approve the latest run instead.' >&2
            exit 1
          }
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -p 2222 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$target" "umask 077; mkdir -p ~/argin-deploy-incoming/$SOURCE_SHA"
          scp -P 2222 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            bundle/api.tar.gz bundle/web.tar.gz bundle/build-info.txt bundle/SHA256SUMS \
            "$target:argin-deploy-incoming/$SOURCE_SHA/"
          ssh -p 2222 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$target" "sudo -n /usr/local/sbin/argin-taxpayer-release --deploy '$SOURCE_SHA'"

